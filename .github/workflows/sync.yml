name: Sync Workouts

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch: {}
  repository_dispatch:
    types: [sync-trigger]

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: pip install ".[cloud]"
      - name: Disable grace period
        run: |
          mkdir -p ~/.hevy2garmin
          echo '{"sync": {"grace_period_minutes": 0}}' > ~/.hevy2garmin/config.json
      - name: Sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: hevy2garmin sync
